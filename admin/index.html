<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f2">
  <title>Sign in | Gharcha Jevan owner dashboard</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Newsreader:opsz,wght@6..72,400..700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body class="admin">
  <main class="login">
    <div class="login__card">
      <a class="login__brand" href="../">
        <img src="../assets/images/logo.svg" alt="" width="48" height="48">
        <span><strong>Gharcha Jevan</strong><small>Food that tastes like home</small></span>
      </a>
      <h1>Owner dashboard</h1>
      <p class="login__intro">Update the menu, prices, specials and photos on your website.</p>
      <div data-login-message hidden></div>
      <div class="login__actions" data-login><span class="spinner" aria-hidden="true"></span></div>
      <a class="login__back" href="../"><i data-lucide="arrow-left" data-size="18"></i>Back to the website</a>
    </div>
  </main>
  <noscript><p class="notice notice--danger" style="margin:1rem">The owner dashboard needs JavaScript. Please turn it on.</p></noscript>
</body>
</html>
